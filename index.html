$(function() {
	
// Displays the image defined by view parameter ie. ?view=Paristexas1984
	
if(window.location.href.indexOf("view") > -1) {
	var getUrlParameter = function getUrlParameter(sParam) {
    var sPageURL = decodeURIComponent(window.location.search.substring(1)),
        sURLVariables = sPageURL.split('&'),
        sParameterName,
        i;

    for (i = 0; i < sURLVariables.length; i++) {
        sParameterName = sURLVariables[i].split('=');

        if (sParameterName[0] === sParam) {
            return sParameterName[1] === undefined ? true : sParameterName[1];
        }
    }
};

	var theArt= getUrlParameter('view');
	var tbg = $('#'+theArt+' img').attr('data-large')
	var cap = $('#'+theArt).next().html()
	var tags = $('#'+theArt).attr('data-tags')


	$('.full .frame').fadeIn(1000).css("background-image", "url("+tbg+")");
	$('.full .specs').html(cap);
	$('.thumb').removeClass('active');
	$('#'+theArt).addClass('active');
	$('.full .caption').fadeIn();
	$('.full .caption-toggle').show();
	$('.popout').attr("href", tbg);

    }

// Automatically displays the first image of the gallery if the url contains #art
    if ( document.location.href.indexOf('#art') > -1 ) {
		var first = $('.thumbs li:first-child img')
        var tbg = $(first).attr('data-large')
		var cap = $(first).parent().next().html()
		$('.full .caption').fadeIn();
		$('.intro').fadeOut();
		$('.full').show().addClass("spinning");
		$('.full .frame').fadeIn(1000).css("background-image", "url("+tbg+")");
		$('.full .specs').html(cap);
		$('.popout').attr("href", tbg);
		$('.thumb').removeClass('active');
		$(first).parent().addClass('active');
		$('.close').show();
    }


});



// Thumbnails fade in on page load
$('.thumbs').fadeIn(500);
$('.thumb img').parent().css('display','inline-block').addClass('active');

// Displays the large image (with caption, etc) when a thumbnail is clicked
$('.thumbs a').on('click', function(){
	var tbg = $(this).children('img').attr('data-large')
	var cap = $(this).next().html()
	var tags = $(this).attr('data-tags')
	$('.full').show().addClass("spinning");
	$('.full .caption').fadeIn();
	$('.full .caption-toggle').show();
	$('.intro').fadeOut();
	$('.full .frame').fadeIn(1000).css("background-image", "url("+tbg+")");
	$('.full .specs').html(cap);
	$('.popout').attr("href", tbg);
	$('.thumb').removeClass('active');
	$(this).addClass('active');
	$('.close').show();
	$('.full .tags').addClass(tags);
	
	
	
	
});

// Slides in Captions on mobile 
$('.caption-toggle').click(function(){
	$('.full .caption').toggleClass('active');
	if ($('.full .caption').hasClass('active')) {
		$('.full .caption').animate({
		left: "0"
	  })
	}
	else {
		$('.full .caption').animate({
		left: "-100%"
	  })
	}
});



// filters thumbnails 
$('.filter').click(function() {
	var a = $(this).attr('id');
	var b = $('.thumb img');
	$('.thumb').addClass('active').hide();
	$('.full .frame').hide();
	$('.full .caption').hide();
	$('.full .caption-toggle').hide();
	$('.intro').hide();
	$('.unfilter').show();
	if (b.hasClass(a)) {
	$('.thumbs .'+a).parent().css('display', 'inline-block');
	}
});
$('.unfilter a').click(function(){
	$('.thumb').addClass('active').css('display', 'inline-block');
	$('.intro').show();
	$(this).parent().hide();
});

// Closes the large image on mobile devices
$('.close').click(function(){
	$(this).hide();
	$('.full').fadeOut();
	$('.full .frame').fadeOut();
	$('.full .caption').fadeOut();
	$('.full .caption-toggle').fadeOut();
});

// Toggles the mobile navigation
$('.burger').click(function(){
	$('.nav .menu').slideToggle();
});


// enables touch swipe scrolling 
$(".frame").touchwipe({
     wipeLeft: function() {
	 	var tbg = $('.thumb.active').parent().next().find('img').attr('data-large')
		var cap = $('.thumb.active').parent().next().find('.caption').html()
		$('.thumb').removeClass('deactivating');
		$('.full .frame').css("background-image", "url("+tbg+")");
		$('.full .specs').html(cap);
		$('.popout').attr("href", tbg);
		$('.thumb.active').addClass('deactivating').removeClass('active');
		$('.thumb.deactivating').parent().next().children('.thumb').addClass('active');
		$('.full .tags').addClass(tags);
	}, 
	wipeRight: function() {
	 	var tbg = $('.thumb.active').parent().prev().find('img').attr('data-large')
		var cap = $('.thumb.active').parent().prev().find('.caption').html()
		$('.thumb').removeClass('deactivating');
		$('.full .frame').css("background-image", "url("+tbg+")");
		$('.full .specs').html(cap);
		$('.popout').attr("href", tbg);
		$('.thumb.active').addClass('deactivating').removeClass('active');
		$('.thumb.deactivating').parent().prev().children('.thumb').addClass('active');
		$('.full .tags').addClass(tags);
	},
	    
     min_move_x: 20,
     min_move_y: 20,
     preventDefaultEvents: true
});

// enables lazy loading (images load when scrolled into the viewport)
$(function() {
    $("img.lazy").lazyload({
        event : "sporty"
    });
});

$(window).bind("load", function() {
    var timeout = setTimeout(function() {
        $("img.lazy").trigger("sporty")
    }, 5000);
});
